services:
  - type: web
    name: trustcheck
    runtime: python

    plan: free

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: |
      uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: ENVIRONMENT
        value: production

      # Optional but recommended
      - key: PYTHONUNBUFFERED
        value: "1"

      - key: LOG_LEVEL
        value: info
